name: Build altc game server agent image

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wolf.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/matt953/altc-game-server-agent-linux:stable
            ghcr.io/matt953/altc-game-server-agent-linux:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
