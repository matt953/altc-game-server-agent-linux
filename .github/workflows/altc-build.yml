name: Build altc game server agent image

on:
  push:
    branches: [stable, 'feat/altc-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/heads/feat/altc-* ]]; then
            TAGS="ghcr.io/matt953/altc-game-server-agent-linux:dev"
          else
            TAGS="ghcr.io/matt953/altc-game-server-agent-linux:stable"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS
          ghcr.io/matt953/altc-game-server-agent-linux:${GITHUB_REF#refs/tags/}"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wolf.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: altc-game-server-agent-linux
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 3
