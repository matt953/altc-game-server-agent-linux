[package]
name = "altc-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
rcgen = "0.13"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
